---
ref: azure.blob_list
name: blob_list
runner_type: python-script
description: List blob metadata with bounded pagination.
enabled: true
entry_point: azure_action.py
parameters:
  operation:
    type: string
    default: blob_list
    immutable: true
  profile:
    type: 'string'
    description: 'Secret JSON profile from the pack-owned encrypted Attune Key azure_profile.'
    required: true
    secret: true
  storage_account:
    type: 'string'
    description: 'Storage account name.'
    required: true
  container:
    type: 'string'
    description: 'Blob container name.'
    required: true
  prefix:
    type: 'string'
    description: 'Optional blob name prefix.'
    required: false
    default: ''
  max_items:
    type: 'integer'
    description: 'Maximum returned items (1..1000).'
    required: false
    default: 500
  max_pages:
    type: 'integer'
    description: 'Maximum service pages (1..100).'
    required: false
    default: 50
