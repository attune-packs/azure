---
ref: azure.keyvault_secret_set
name: keyvault_secret_set
runner_type: python-script
description: Set a Key Vault secret without returning its value.
enabled: true
entry_point: azure_action.py
parameters:
  operation:
    type: string
    default: keyvault_secret_set
    immutable: true
  profile:
    type: 'string'
    description: 'Secret JSON profile from the pack-owned encrypted Attune Key azure_profile.'
    required: true
    secret: true
  vault_name:
    type: 'string'
    description: 'Key Vault name.'
    required: true
  name:
    type: 'string'
    description: 'Resource name.'
    required: true
  secret_value:
    type: 'string'
    description: 'Secret value; always redacted.'
    required: true
    secret: true
  content_type:
    type: 'string'
    description: 'Optional content type.'
    required: false
    default: ''
  tags_json:
    type: 'string'
    description: 'Flat JSON object of tags.'
    required: false
    default: '{}'
