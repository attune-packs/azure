---
ref: azure.subnet_list
name: subnet_list
runner_type: python-script
description: List subnets in a virtual network.
enabled: true
entry_point: azure_action.py
parameters:
  operation:
    type: string
    default: subnet_list
    immutable: true
  profile:
    type: 'string'
    description: 'Secret JSON profile from the pack-owned encrypted Attune Key azure_profile.'
    required: true
    secret: true
  resource_group:
    type: 'string'
    description: 'Azure resource group name.'
    required: true
  vnet_name:
    type: 'string'
    description: 'Virtual network name.'
    required: true
  max_items:
    type: 'integer'
    description: 'Maximum returned items (1..1000).'
    required: false
    default: 500
  max_pages:
    type: 'integer'
    description: 'Maximum service pages (1..100).'
    required: false
    default: 50
