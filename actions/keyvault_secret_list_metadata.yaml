---
ref: azure.keyvault_secret_list_metadata
name: keyvault_secret_list_metadata
runner_type: python-script
description: List Key Vault secret metadata; values are never retrieved.
enabled: true
entry_point: azure_action.py
parameters:
  operation:
    type: string
    default: keyvault_secret_list_metadata
    immutable: true
  profile:
    type: 'string'
    description: 'Secret JSON profile from the pack-owned encrypted Attune Key azure_profile.'
    required: true
    secret: true
  vault_name:
    type: 'string'
    description: 'Key Vault name.'
    required: true
  max_items:
    type: 'integer'
    description: 'Maximum returned items (1..1000).'
    required: false
    default: 500
  max_pages:
    type: 'integer'
    description: 'Maximum service pages (1..100).'
    required: false
    default: 50
