---
ref: azure.subscriptions_list
name: subscriptions_list
runner_type: python-script
description: List subscriptions visible to the profile tenant.
enabled: true
entry_point: azure_action.py
parameters:
  operation:
    type: string
    default: subscriptions_list
    immutable: true
  profile:
    type: 'string'
    description: 'Secret JSON profile from the pack-owned encrypted Attune Key azure_profile.'
    required: true
    secret: true
  max_items:
    type: 'integer'
    description: 'Maximum returned items (1..1000).'
    required: false
    default: 500
  max_pages:
    type: 'integer'
    description: 'Maximum service pages (1..100).'
    required: false
    default: 50
