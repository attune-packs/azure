---
ref: azure.vm_deallocate
name: vm_deallocate
runner_type: python-script
description: Deallocate a virtual machine and poll to completion.
enabled: true
entry_point: azure_action.py
parameters:
  operation:
    type: string
    default: vm_deallocate
    immutable: true
  profile:
    type: 'string'
    description: 'Secret JSON profile from the pack-owned encrypted Attune Key azure_profile.'
    required: true
    secret: true
  resource_group:
    type: 'string'
    description: 'Azure resource group name.'
    required: true
  name:
    type: 'string'
    description: 'Resource name.'
    required: true
  poll_timeout:
    type: 'integer'
    description: 'Bounded long-running-operation timeout in seconds.'
    required: false
    default: 1200
